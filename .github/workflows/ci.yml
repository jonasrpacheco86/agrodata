name: CI
# Cadeia de suprimentos e verificação automatizada (ADR-003): 3 checks baratos.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  seguranca-segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # histórico completo para varrer segredos vazados
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  analise-estatica:
    name: Análise estática (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3   # lê ruff.toml; não importa Airflow, só analisa
        with:
          args: check dags/

  auditoria-dependencias:
    name: Auditoria de dependências (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

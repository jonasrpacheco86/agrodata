name: CI
# Cadeia de suprimentos e verificação automatizada (ADR-003 + ADR-009).
# Todas as actions são pinadas por SHA de commit: uma tag móvel (@v4) é código de terceiro que muda
# sozinho dentro do nosso pipeline. O comentário ao lado registra a versão legível; o Dependabot
# (.github/dependabot.yml) abre PR quando houver atualização — pin não vira pin esquecido.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  seguranca-segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0            # histórico completo para varrer segredos vazados
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  analise-estatica:
    name: Análise estática (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:                              # lê ruff.toml; não importa Airflow/mcp, só analisa
          args: check dags/ mcp_server/

  testes-borda:
    name: Testes da borda pública (pytest)
    # A borda é o único código exposto à internet (ADR-008) e concentrou os defeitos da revisão da
    # Fase 5: tetos que se realimentavam, contadores que se misturavam, dicionário sem limite.
    # Os testes não instalam psycopg/mcp/fastembed — usam stubs (ver o módulo), então o job custa
    # segundos e roda em todo push, ao contrário do build de imagem (ADR-010).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest mcp_server/ -q

  auditoria-dependencias:
    name: Auditoria de dependências (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: pip-audit -r mcp_server/requirements.txt

  imagem-mcp:
    name: Imagem do MCP (build + scan + non-root)
    # Só o MCP vai para a internet (ADR-008), então só a imagem dele é construída e varrida aqui.
    # Restrito a PR e ao main porque o build embute o modelo de embeddings (~120 MB): rodar isto
    # em todo push de branch queimaria minutos de CI sem informação nova (ADR-010).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build da imagem publicada
        run: docker build -f mcp_server/Dockerfile -t agrodata-mcp:ci .
      - name: Prova de que o processo não roda como root (ADR-001/ADR-009)
        run: |
          uid=$(docker run --rm agrodata-mcp:ci id -u)
          echo "uid=$uid"
          test "$uid" -ne 0
      - name: Varredura da imagem (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agrodata-mcp:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true       # falha só no que dá para corrigir; ruído não é sinal
          exit-code: "1"
